<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Dark background -->
  <rect width="192" height="192" fill="#0f1021"/>
  
  <!-- Gaming gear icon: joystick/gamepad style -->
  <circle cx="96" cy="96" r="80" fill="none" stroke="#ff4da9" stroke-width="8"/>
  
  <!-- D-pad squares -->
  <rect x="45" y="75" width="16" height="16" fill="#ff4da9"/>
  <rect x="75" y="45" width="16" height="16" fill="#ff4da9"/>
  <rect x="105" y="45" width="16" height="16" fill="#ff4da9"/>
  <rect x="135" y="75" width="16" height="16" fill="#ff4da9"/>
  
  <!-- Center circle -->
  <circle cx="96" cy="96" r="20" fill="none" stroke="#ffd369" stroke-width="4"/>
  <circle cx="96" cy="96" r="10" fill="#ffd369"/>
</svg>
